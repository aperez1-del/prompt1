<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Trivia Interactiva</title>

<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5fa, #2980b9);
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 15px;
    max-width: 600px;
    margin: auto;
}

h1 {
    margin-bottom: 20px;
}

.question {
    font-size: 20px;
    margin-bottom: 15px;
}

.options button {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.correct {
    background-color: #2ecc71 !important;
}

.incorrect {
    background-color: #e74c3c !important;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#nextBtn {
    margin-top: 15px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: #f1c40f;
    cursor: pointer;
}

.result {
    font-size: 22px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container animate__animated animate__fadeIn">
    <h1>Trivia de Conocimientos Generales</h1>
    <div id="quiz"></div>
    <button id="nextBtn" disabled>Siguiente</button>
</div>

<script>
const questions = [
    { q: "¿Capital de Francia?", options: ["Madrid", "París", "Roma", "Berlín"], answer: 1 },
    { q: "¿Planeta más grande?", options: ["Tierra", "Marte", "Júpiter", "Venus"], answer: 2 },
    { q: "¿Autor de Don Quijote?", options: ["Cervantes", "Shakespeare", "Borges", "Neruda"], answer: 0 },
    { q: "¿Cuántos continentes hay?", options: ["5", "6", "7", "8"], answer: 2 },
    { q: "¿Elemento químico H?", options: ["Helio", "Hierro", "Hidrógeno", "Mercurio"], answer: 2 },
    { q: "¿Idioma más hablado?", options: ["Inglés", "Español", "Chino", "Árabe"], answer: 2 },
    { q: "¿Año de llegada a la Luna?", options: ["1969", "1975", "1950", "1980"], answer: 0 },
    { q: "¿Animal más rápido?", options: ["León", "Tigre", "Guepardo", "Caballo"], answer: 2 },
    { q: "¿Océano más grande?", options: ["Atlántico", "Índico", "Pacífico", "Ártico"], answer: 2 },
    { q: "¿Quién pintó la Mona Lisa?", options: ["Van Gogh", "Da Vinci", "Picasso", "Dalí"], answer: 1 }
];

let current = 0;
let score = 0;
let answered = false;

const quiz = document.getElementById("quiz");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion() {
    answered = false;
    nextBtn.disabled = true;

    const q = questions[current];
    quiz.innerHTML = `
        <div class="question animate__animated animate__fadeIn">${q.q}</div>
        <div class="options">
            ${q.options.map((opt, i) => `<button onclick="selectAnswer(${i})">${opt}</button>`).join("")}
        </div>
    `;
}

function selectAnswer(index) {
    if (answered) return;

    answered = true;
    const buttons = document.querySelectorAll(".options button");
    const correctIndex = questions[current].answer;

    buttons.forEach((btn, i) => {
        if (i === correctIndex) {
            btn.classList.add("correct");
        }
        if (i === index && i !== correctIndex) {
            btn.classList.add("incorrect");
        }
        btn.disabled = true;
    });

    if (index === correctIndex) {
        score++;
    }

    nextBtn.disabled = false;
}

nextBtn.addEventListener("click", () => {
    current++;
    if (current < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
});

function showResult() {
    let feedback = "";

    if (score <= 4) {
        feedback = "Puedes mejorar 😅";
    } else if (score <= 7) {
        feedback = "Buen trabajo 👍";
    } else {
        feedback = "¡Excelente! 🌟";
    }

    quiz.innerHTML = `
        <div class="result animate__animated animate__zoomIn">
            Puntaje: ${score} / ${questions.length}<br><br>
            ${feedback}
        </div>
    `;
    nextBtn.style.display = "none";
}

loadQuestion();
</script>

</body>
</html>
